name: CI/CD

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test WrenchBox.Functions.sln -c Release

  deploy:
    name: Deploy function
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        run: dotnet publish src/WrenchBox.Functions/WrenchBox.Functions.csproj -c Release -o publish
      - name: Check Azure deploy settings
        id: azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FUNCTION_APP: ${{ github.ref_name == 'main' && vars.FUNCTION_APP_PROD || vars.FUNCTION_APP_HOMOLOG }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] && [ -n "$FUNCTION_APP" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy da função ignorado. Cadastre os segredos AZURE_CLIENT_ID, AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID e a variável FUNCTION_APP_HOMOLOG ou FUNCTION_APP_PROD."
          fi
      - name: Azure login
        if: steps.azure.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        if: steps.azure.outputs.enabled == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ github.ref_name == 'main' && vars.FUNCTION_APP_PROD || vars.FUNCTION_APP_HOMOLOG }}
          package: publish
